    </header>

    <section id="hero-form">
        <div class="container formp-grid">
            <h2>Sign in</h2>

            <form action="">
                <div>
                    <label for="">Email</label>
                    <input type="email" name="email" placeholder="Enter Email id or phone no" required />
                </div>

                <div>
                    <label for="">Password</label>
                    <input type="password" name="pw" minlength="6" placeholder="Enter your password " required />
                </div>

                <button class="btn full" type="submit">Sign in</button>
            </form>

            <p class="switch">
                New to Luxora?
                <span id="btn-1"> Create account</span>
            </p>
        </div>
    </section>

    <section id="sec-form">
        <div class="container formp-grid">
            <h2>Create Account</h2>

            <form action="">
                <div>
                    <label for="">Full Name</label>
                    <input type="email" name="email" placeholder="Enter your name" required />
                </div>

                <div>
                    <label for="">Email</label>
                    <input type="email" name="email" placeholder="Enter Email id " required />
                </div>

                <div>
                    <label for="">Password</label>
                    <input type="password" name="pw" minlength="6" placeholder="Enter your password " required />
                </div>

                <button class="btn full" type="submit">Sign in</button>
            </form>

            <p class="switch">
                Already have an account?
                <span id="btn-2">Sign in</span>
            </p>
        </div>
    </section>
</body>

<script>
    $(document).ready(function() {
        $("#sec-form").hide();

        $("#btn-1").click(function() {
            $("#sec-form").slideToggle(500);
            $("#hero-form").hide();
        });

        $("#btn-2").click(function() {
            $("#hero-form").slideToggle(500);
            $("#sec-form").hide();
        });

        $("#backbtn").click(function() {
            history.back();
        });
    });

</script>
